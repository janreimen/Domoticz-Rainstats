name: Bug report
description: Report a reproducible problem with Domoticz-Rainstats
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem.

        Please search existing issues first. Never include passwords or other personal data. If a window shows a wrong value, the output of `python3 -m rain_stats --rain-idx <IDX> --json` (what the plugin reads from your rain device) and of `python3 -m rain_stats --state --json` (what it has stored) are the most useful things you can attach.

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: The version shown in the first plugin line of the Domoticz log ("Rain Statistics X.Y.Z starting ...").
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: domoticz_version
    attributes:
      label: Domoticz version
      description: Include the build or release identifier if available.
      placeholder: "e.g. 2026.4"
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system and Python version
      placeholder: "e.g. Raspberry Pi OS, Python 3.13"
    validations:
      required: true

  - type: dropdown
    id: counter
    attributes:
      label: What does your rain device count?
      description: The setting "Rain counter" of the hardware.
      options:
        - Rain today, reset at midnight (daily)
        - A total that never resets (total)
        - I do not know
    validations:
      required: true

  - type: dropdown
    id: issue_area
    attributes:
      label: Affected functionality
      options:
        - Installation or configuration
        - Domoticz cannot be read (address, port, login, https)
        - A rain value is wrong or missing
        - A peak rain rate is wrong or missing
        - A reset at midnight or a restart of the sensor
        - Import of the dzVents script's data file
        - State file (loading, saving, corrupt)
        - Devices created, renamed or removed
        - Plugin startup or shutdown
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: Explain what happens and why it is unexpected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the hardware...
        2. Wait for an update...
        3. Observe the result...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Set the hardware's Debug setting to Verbose first if you can. Passwords never reach the log, but check the text before you post it.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Does it happen every time? Did it work in an earlier version?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar problem.
          required: true
        - label: I removed passwords and private data from this report.
          required: true
