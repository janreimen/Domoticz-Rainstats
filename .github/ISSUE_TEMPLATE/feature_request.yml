name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and the proposed improvement.

        For a new source of rain data (another Domoticz device type, MQTT, a weather station API), say what the data look like: a counter or a rate, in which unit, how often it changes. Do not include personal data.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Explain the limitation or use case.
      placeholder: I would like to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like the feature to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative solutions.
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - Windows or statistics (other periods, other measures)
        - A new source of rain data
        - Domoticz devices or presentation
        - Configuration or installation
        - Logging or diagnostics
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues, the roadmap and the documentation for this feature.
          required: true
        - label: I have not included personal data.
          required: true
