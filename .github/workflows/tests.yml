name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no Python 3.9 for Ubuntu 26.04 (what ubuntu-latest is now): the oldest version stays
          # tested on Ubuntu 24.04, because Domoticz hosts run old Pythons
          - {python-version: "3.9", os: ubuntu-24.04}
          - {python-version: "3.10", os: ubuntu-latest}
          - {python-version: "3.11", os: ubuntu-latest}
          - {python-version: "3.12", os: ubuntu-latest}
          - {python-version: "3.13", os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests (a fake Domoticz on a real HTTP/TLS server; openssl makes the test certificates)
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 vermin
      - name: pyflakes checks (Domoticz injects Parameters, Devices, Images)
        run: python -m flake8 --select=F --builtins=Parameters,Devices,Images plugin.py rain_stats tests tools
      - name: shellcheck
        run: shellcheck deploy.sh
      - name: Code must stay Python 3.7 compatible (Domoticz hosts run old Pythons)
        run: vermin --target=3.7- --no-tips --violations -q plugin.py rain_stats
      - name: docs/DEVICES.md is up to date
        run: python tools/gen_device_catalog.py --check
